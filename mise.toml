[tools]
# Please also keep the version aligned in the go.mod file
go = '1.27.4'
"go:gotest.tools/gotestsum" = 'v1.13.0'
golangci-lint = '2.15.0'
goreleaser = '2.20.3'
shellcheck = '0.11.0'
"go:golang.org/x/vuln/cmd/govulncheck" = 'v1.10.0'

[tasks.fmt]
description = "Run gofmt"
run = "gofmt -s -w ."

[tasks.test]
description = "Run tests"
run = "gotestsum --format pkgname --format-icons text --format-hide-empty-pkg --hide-summary skipped -- ./..."

[tasks."test:ci"]
description = "Run all tests with race detection"
run = "go test -race ./..."

[tasks.check]
description = "Run formatting, linting, and CI tests"
depends = ["fmt", "lint", "test:ci"]

[tasks."release:snapshot"]
description = "Build release archives locally under dist/ without publishing"
run = "goreleaser release --snapshot --clean"
